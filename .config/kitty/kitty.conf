# Font configuration (Thick & Crisp Cascadia Code Nerd Font)
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling (Nord Polar Night background, sharp 0px padding)
window_padding_width 12
background_opacity 0.95
confirm_os_window_close 0

# Nord Color Scheme
foreground            #d8dee9
background            #2e3440
selection_foreground  #2e3440
selection_background  #88c0d0

# Cursor colors
cursor                #88c0d0
cursor_text_color     #2e3440

# URL underline color
url_color             #88c0d0

# Window border colors
active_border_color   #88c0d0
inactive_border_color #4c566a
bell_border_color     #ebcb8b

# Tab bar colors
active_tab_foreground   #2e3440
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #3b4252
tab_bar_background      #2e3440

# The 16 terminal colors (Nord palette)
# Black (Polar Night)
color0 #3b4252
color8 #4c566a

# Red (Aurora Red)
color1 #bf616a
color9 #bf616a

# Green (Aurora Green)
color2  #a3be8c
color10 #a3be8c

# Yellow (Aurora Yellow)
color3  #ebcb8b
color11 #ebcb8b

# Blue (Frost Blue)
color4  #81a1c1
color12 #81a1c1

# Magenta (Aurora Purple)
color5  #b48ead
color13 #b48ead

# Cyan (Frost Cyan)
color6  #88c0d0
color14 #8fbcbb

# White (Snow Storm)
color7  #e5e9f0
color15 #eceff4
