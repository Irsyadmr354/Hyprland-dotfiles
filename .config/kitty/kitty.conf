# Font configuration (Thick & Crisp Cascadia Code Nerd Font)
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling (Deep Obsidian background, sharp 0px padding)
window_padding_width 12
background_opacity 0.95
confirm_os_window_close 0

# Mono Neutral
foreground            #EDEDED
background            #141414
selection_foreground  #141414
selection_background  #EDEDED

# Cursor colors
cursor                #EDEDED
cursor_text_color     #141414

# URL underline color
url_color             #EDEDED

# Window border colors
active_border_color   #EDEDED
inactive_border_color #333333
bell_border_color     #E5484D

# Tab bar colors
active_tab_foreground   #141414
active_tab_background   #EDEDED
inactive_tab_foreground #8A8A8A
inactive_tab_background #1E1E1E
tab_bar_background      #141414

# The 16 terminal colors (Mono neutral)
# Black
color0 #1E1E1E
color8 #5A5A5A

# Red
color1 #E5484D
color9 #FF6369

# Green
color2  #B8B8B8
color10 #EDEDED

# Yellow
color3  #E8A13C
color11 #FFB224

# Blue
color4  #B8B8B8
color12 #EDEDED

# Magenta
color5  #B8B8B8
color13 #EDEDED

# Cyan
color6  #8A8A8A
color14 #B8B8B8

# White
color7  #8A8A8A
